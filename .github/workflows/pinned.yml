name: Update pinned projects

# Reads the repositories pinned on the GitHub profile and writes them to pinned.json.
# The site reads that file, so a newly pinned repository appears on the site by itself.
on:
  schedule:
    - cron: "17 * * * *"      # every hour
  workflow_dispatch:           # manual run from the Actions tab
  push:
    branches: [master]
    paths: [".github/workflows/pinned.yml"]

permissions:
  contents: write

concurrency:
  group: pinned
  cancel-in-progress: true

jobs:
  pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -f owner="$GITHUB_REPOSITORY_OWNER" -f query='
            query($owner: String!) {
              user(login: $owner) {
                pinnedItems(first: 6, types: REPOSITORY) {
                  nodes {
                    ... on Repository {
                      nameWithOwner name description homepageUrl
                      stargazerCount pushedAt
                      primaryLanguage { name }
                    }
                  }
                }
              }
            }' \
          | jq '[.data.user.pinnedItems.nodes[] | {
              repo: .nameWithOwner,
              name: .name,
              description: (.description // ""),
              homepage: (.homepageUrl // ""),
              stars: .stargazerCount,
              pushed: .pushedAt,
              language: (.primaryLanguage.name // "")
            }]' > pinned.new.json
          # never replace the file with an empty list if the API hiccups
          test "$(jq length pinned.new.json)" -gt 0
          mv pinned.new.json pinned.json

      - name: Commit if the list changed
        run: |
          if [ -n "$(git status --porcelain pinned.json)" ]; then
            git config user.name "Abrorov Shahriyor"
            git config user.email "shahriyorabrorovtech@gmail.com"
            git add pinned.json
            git commit -m "Update pinned projects"
            git push
          fi
