name: Build data

# After every push (and once a day) refresh the GitHub stats for the project cards
# and stamp ?v=<hash> on css/js links so browsers pick up new versions right away.
on:
  push:
    branches: [master]
    paths:
      - "assets/**"
      - "*.html"
      - "tools/**"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: GitHub stats for project cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -I tools/github-data.py .

      - name: Version asset URLs
        run: python -I tools/bump-version.py .

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update build data"
          git pull --rebase
          git push
