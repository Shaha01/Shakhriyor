.flash{opacity:0;animation:flash 6s linear infinite}
.bolt{opacity:0;animation:flash 6s linear infinite}
@keyframes flash{0%,80%{opacity:0}81%{opacity:.35}82%{opacity:0}84%{opacity:.6}87%{opacity:0}100%{opacity:0}}

