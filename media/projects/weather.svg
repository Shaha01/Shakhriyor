.rain line{animation:fall linear infinite}
@keyframes fall{to{transform:translate(-150px,600px)}}
.c1{animation:cl 22s ease-in-out infinite alternate}
.c2{animation:cl 30s ease-in-out infinite alternate-reverse}
.c3{animation:cl 18s ease-in-out infinite alternate}
