.flare{animation:fl 40s linear infinite}
@keyframes fl{from{transform:translate(620px,280px) rotate(0)}to{transform:translate(620px,280px) rotate(360deg)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

