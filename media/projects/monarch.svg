.m{font-family:Consolas,'JetBrains Mono','Courier New',monospace;font-weight:400;letter-spacing:.18em}

.stars circle{animation:tw ease-in-out infinite alternate}
@keyframes tw{from{opacity:.15}to{opacity:1}}
.glow{transform-origin:620px 280px;animation:gl 4s ease-in-out infinite alternate}
