.blink{animation:bl 4s steps(1) infinite}
@keyframes bl{0%{opacity:1}90%{opacity:.2}92%{opacity:1}94%{opacity:.3}96%{opacity:1}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

